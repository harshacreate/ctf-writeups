[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-practice-lab"
version = "0.1.0"
description = "Self-contained local CTF-style exercises and reference walkthroughs"
requires-python = ">=3.9"
dependencies = ["Flask>=3.0,<4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
